name: Deploy EKS Runtime

on:
  workflow_dispatch:
    inputs:
      environment:
        description: AWS environment to deploy
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
      confirm_apply:
        description: Apply the reviewed AWS plan and deploy Kubernetes manifests
        required: true
        default: false
        type: boolean
      confirm_data_cutover:
        description: Confirm an EFS recovery point and approved maintenance window
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: eks-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: 1ChristianAlex/motordesk-infrastructure/.github/workflows/deploy-eks.yml@main

    with:
      environment: ${{ inputs.environment }}
      confirm_apply: ${{ inputs.confirm_apply }}
      confirm_data_cutover: ${{ inputs.confirm_data_cutover }}

      aws_region: ${{ vars.AWS_REGION }}
      aws_tf_backend_bucket: ${{ vars.AWS_TF_BACKEND_BUCKET }}
      api_domain_name: ${{ vars.API_DOMAIN_NAME }}
      route53_zone_id: ${{ vars.ROUTE53_ZONE_ID }}
      ses_from_address: ${{ vars.SES_FROM_ADDRESS }}

    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
      NEW_RELIC_EKS_LICENSE_KEY: ${{ secrets.NEW_RELIC_EKS_LICENSE_KEY }}
