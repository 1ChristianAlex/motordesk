name: Terraform AWS Validation

on:
  pull_request:
    paths:
      - "infra/terraform/aws/**"
      - ".github/workflows/terraform-aws.yml"
  push:
    branches:
      - dev
      - main
    paths:
      - "infra/terraform/aws/**"
      - ".github/workflows/terraform-aws.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: AWS environment to manage
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
      operation:
        description: Terraform operation
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      confirm_apply:
        description: Confirm applying the generated plan
        required: true
        default: false
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, qa, prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Terraform Format
        working-directory: infra/terraform/aws
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: infra/terraform/aws/envs/${{ matrix.environment }}
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: infra/terraform/aws/envs/${{ matrix.environment }}
        run: terraform validate -no-color

  plan-apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_TF_BACKEND_BUCKET: ${{ vars.AWS_TF_BACKEND_BUCKET }}
    defaults:
      run:
        working-directory: infra/terraform/aws/envs/${{ inputs.environment }}
    steps:
      - name: Confirm apply request
        if: inputs.operation == 'apply' && inputs.confirm_apply != true
        run: |
          echo "::error::Set confirm_apply to true before running Terraform apply."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_TERRAFORM_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_TERRAFORM_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check Terraform state bucket
        run: |
          if [ -z "$AWS_TF_BACKEND_BUCKET" ]; then
            echo "::error::Set the AWS_TF_BACKEND_BUCKET variable in the selected GitHub Environment."
            exit 1
          fi

          if ! aws s3api head-bucket --bucket "$AWS_TF_BACKEND_BUCKET"; then
            echo "::error::Terraform state bucket '$AWS_TF_BACKEND_BUCKET' does not exist or is inaccessible. Bootstrap it with infra/terraform/aws/backend before running this workflow."
            exit 1
          fi

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${AWS_TF_BACKEND_BUCKET}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform Apply
        if: inputs.operation == 'apply' && inputs.confirm_apply == true
        run: terraform apply -input=false -auto-approve tfplan
