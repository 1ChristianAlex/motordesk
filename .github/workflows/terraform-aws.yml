name: Terraform AWS Validation

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - "infra/kubernetes/**"
      - ".github/scripts/**"
      - ".github/workflows/deploy-eks.yml"
      - ".github/workflows/terraform-aws.yml"
  push:
    branches:
      - dev
      - main
    paths:
      - "infra/terraform/**"
      - "infra/kubernetes/**"
      - ".github/scripts/**"
      - ".github/workflows/deploy-eks.yml"
      - ".github/workflows/terraform-aws.yml"

permissions:
  contents: read

jobs:
  validate-aws:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, qa, prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Terraform Format
        working-directory: infra/terraform/aws
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: infra/terraform/aws/envs/${{ matrix.environment }}
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: infra/terraform/aws/envs/${{ matrix.environment }}
        run: terraform validate -no-color

  validate-kubernetes-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate Kubernetes YAML and deployment scripts
        run: |
          bun .github/scripts/validate-kubernetes-yaml.js
          bash -n infra/kubernetes/deploy-workloads.sh
          bash -n infra/kubernetes/helm/install-addons.sh
