name: Deploy AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: AWS environment to deploy
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ inputs.environment == 'dev' && vars.AWS_DEV_DEPLOY_ROLE_ARN || inputs.environment == 'qa' && vars.AWS_QA_DEPLOY_ROLE_ARN || vars.AWS_PROD_DEPLOY_ROLE_ARN }}
      AWS_ECR_REPOSITORY: motordesk/${{ inputs.environment }}/api
      AWS_ECS_CLUSTER: motordesk-${{ inputs.environment }}
      AWS_ECS_SERVICE: motordesk-${{ inputs.environment }}-api
      AWS_TASK_FAMILY: motordesk-${{ inputs.environment }}-api
      IMAGE_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
      AWS_DESIRED_COUNT: ${{ inputs.environment == 'prod' && '2' || '1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew test build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build \
            -f infra/docker/Dockerfile \
            -t "$ECR_REGISTRY/$AWS_ECR_REPOSITORY:$IMAGE_TAG" \
            .
          docker push "$ECR_REGISTRY/$AWS_ECR_REPOSITORY:$IMAGE_TAG"

      - name: Register task definition and deploy
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$AWS_TASK_FAMILY" \
            --query taskDefinition \
            --output json > task-definition.json

          jq --arg image "$ECR_REGISTRY/$AWS_ECR_REPOSITORY:$IMAGE_TAG" \
            '.containerDefinitions[0].image = $image
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                    .compatibilities, .registeredAt, .registeredBy)' \
            task-definition.json > task-definition.deploy.json

          task_definition_arn=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.deploy.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)

          aws ecs update-service \
            --cluster "$AWS_ECS_CLUSTER" \
            --service "$AWS_ECS_SERVICE" \
            --task-definition "$task_definition_arn" \
            --desired-count "$AWS_DESIRED_COUNT"

          aws ecs wait services-stable \
            --cluster "$AWS_ECS_CLUSTER" \
            --services "$AWS_ECS_SERVICE"
