name: Terraform AWS Deploy

on:
  pull_request:
    paths:
      - "infra/terraform/aws/**"
      - ".github/workflows/terraform-aws.yml"
  push:
    branches:
      - dev
      - main
    paths:
      - "infra/terraform/aws/**"
      - ".github/workflows/terraform-aws.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: AWS environment to manage
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
      operation:
        description: Terraform operation
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      confirm_apply:
        description: Confirm applying the generated plan
        required: true
        default: false
        type: boolean

jobs:
  terraform:
    uses: ./.github/workflows/terraform-aws.yml
    permissions:
      contents: read
    with:
      environment: ${{ inputs.environment || 'dev' }}
      operation: ${{ inputs.operation || 'plan' }}
      confirm_apply: ${{ inputs.confirm_apply || false }}
      run_terraform: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit

  docker-deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply' && inputs.confirm_apply == true
    needs: terraform
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_URL: ${{ needs.terraform.outputs.ecr_repository_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and push Docker image
        run: |
          set -euo pipefail

          registry="${ECR_REPOSITORY_URL%%/*}"
          image_tag="$GITHUB_SHA"

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry"

          docker build \
            --file infra/docker/Dockerfile \
            --tag "$ECR_REPOSITORY_URL:$image_tag" \
            .

          docker push "$ECR_REPOSITORY_URL:$image_tag"

  terraform-deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply' && inputs.confirm_apply == true
    needs: [terraform, docker-deploy]
    uses: ./.github/workflows/terraform-aws.yml
    permissions:
      contents: read
    with:
      environment: ${{ inputs.environment }}
      operation: apply
      confirm_apply: true
      run_terraform: true
      image_tag: ${{ github.sha }}
    secrets: inherit
