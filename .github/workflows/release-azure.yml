name: Release Azure

on:
  push:
    branches:
      - dev
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment (dev, qa, prod)'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (dev, qa, prod)'
        required: false
        type: string
        default: 'dev'

jobs:
  ci:
    uses: ./.github/workflows/ci-tests.yml

  build-and-deploy:
    needs: ci
    runs-on: ubuntu-latest

    env:
      PROJECT_NAME: motordesk
      ENVIRONMENT: ${{ inputs.environment || (github.ref_type == 'branch' && github.ref_name == 'dev' && 'dev' || 'qa') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR
        id: acr
        run: |
          ACR_NAME=$(az acr list \
            --resource-group terraform-${{ env.ENVIRONMENT }}-motordesk \
            --query "[0].name" \
            --output tsv)

          echo "name=$ACR_NAME" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        run: |
          az acr login \
            --name "${{ steps.acr.outputs.name }}"

      - name: Build API image
        run: |
          docker build \
            -f infra/docker/Dockerfile \
            -t "${{ steps.acr.outputs.name }}.azurecr.io/motordesk/api:${{ github.run_number }}" \
            .

      - name: Build Redis image
        run: |
          docker build \
            -f infra/docker/redis.Dockerfile \
            -t "${{ steps.acr.outputs.name }}.azurecr.io/motordesk/redis:${{ github.run_number }}" \
            .

      - name: Push API image
        run: |
          docker push \
            "${{ steps.acr.outputs.name }}.azurecr.io/motordesk/api:${{ github.run_number }}"

      - name: Push Redis image
        run: |
          docker push \
            "${{ steps.acr.outputs.name }}.azurecr.io/motordesk/redis:${{ github.run_number }}"

  deploy-infrastructure:
    needs: build-and-deploy
    uses: ./.github/workflows/terraform-azure.yml
    with:
      environment: ${{ inputs.environment || (github.ref_type == 'branch' && github.ref_name == 'dev' && 'dev' || 'qa') }}
      image_tag: ${{ github.run_number }}
      new-backend: false
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}