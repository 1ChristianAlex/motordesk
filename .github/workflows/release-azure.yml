name: release-azure



on:
  push:
    branches:
      - dev
    tags:
      - "*"

permissions:
  contents: read
  id-token: write

jobs:
  ci-tests:
    uses: ./.github/workflows/ci-tests.yml

  build-and-push:
    needs: ci-tests
    runs-on: ubuntu-latest

    env:
      PROJECT_NAME: motordesk
      AZURE_RESOURCE_GROUP: ${{ github.ref_type == 'branch' && github.ref_name == 'dev' && 'terraform-dev-motordesk' || 'terraform-qa-motordesk' }}
      ACR_NAME: ${{ github.ref_type == 'branch' && github.ref_name == 'dev' && 'devmotordeskacr' || 'qamotordeskacr' }}
      IMAGE_TAG: ${{ github.ref_type == 'branch' && github.ref_name == 'dev' && 'dev' || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Azure Container Registry
        id: acr
        run: |
          echo "login_server=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Login to Azure Container Registry
        run: |
          az acr login --name "$ACR_NAME"

      - name: Build and Push Application Image
        run: |
          docker build \
            -f infra/docker/Dockerfile \
            -t "${{ steps.acr.outputs.login_server }}/${PROJECT_NAME}:${IMAGE_TAG}" \
            .
          docker push "${{ steps.acr.outputs.login_server }}/${PROJECT_NAME}:${IMAGE_TAG}"
