info:
  name: Manager - Create a new vehicle
  type: http
  seq: 2
  tags:
    - vehicles
    - create

http:
  method: POST
  url: "{{baseUrl}}/vehicles/create"
  body:
    type: json
    data: |-
      {
        "plate": "ABC3E23",
        "brand": "Toyota",
        "model": "Corolla XEi",
        "color": "Prata",
        "year": 2022,
        "mileage": 45800,
        "chassis": "9BRBD48E0D2234567",
        "fuelType": "FLEX",
        "ownerId": 1
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

