info:
  name: Manager - Update vehicle
  type: http
  seq: 3
  tags:
    - vehicles
    - update

http:
  method: PUT
  url: "{{baseUrl}}/vehicles/update"
  body:
    type: json
    data: |-
      {
        "id": 1,
        "color": "Blue",
        "mileage": 56663
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: "200"
    request:
      url: "{{baseUrl}}/vehicles/update"
      method: PUT
      body:
        type: json
        data: |-
          {
            "id": 1,
            "color": "RED",
            "mileage": 56663
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {},
            "status": 9036,
            "errors": null
          }
  - name: 400 Response
    description: "400"
    request:
      url: "{{baseUrl}}/vehicles/update"
      method: PUT
      body:
        type: json
        data: |-
          {
            "id": 1,
            "color": "RED",
            "mileage": 56663
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {},
            "status": 9036,
            "errors": null
          }
