version: '3.8'

services:
  sql-database:
    image: postgres:15-alpine
    container_name: motordesk_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: motordesk
      POSTGRES_PASSWORD: motordesk_pass
      POSTGRES_DB: motordesk
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
  #    volumes:
  #      - postgres_data:/var/lib/postgresql/data

  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: motordesk_dynamodb
    command: [ "-sharedDb", "-dbPath", "./data" ]
    working_dir: /home/dynamodblocal
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

  redis:
    image: redis:8-alpine
    container_name: motordesk_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - motordesk_pass
      - --user
      - motordesk
      - "on"
      - ">motordesk_pass"
      - "~*"
      - "+@all"
    #    volumes:
    #      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "motordesk_pass",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  dynamodb_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs: