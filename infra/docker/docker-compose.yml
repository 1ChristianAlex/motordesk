services:
  app:
    build: { context: ../.., dockerfile: infra/docker/Dockerfile }
    ports: [ "8080:8080" ]
    depends_on:
      sql-database: { condition: service_healthy }
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }

    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_USER: ${MONGO_USER:?Set MONGO_USER for the local MongoDB container}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD for the local MongoDB container}
      MONGO_DATABASE: ${MONGO_DATABASE:-motordesk}
      MONGO_OPTIONS: ""
    networks: [ backend, frontend ]

  sql-database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: motordesk
      POSTGRES_PASSWORD: motordesk_pass
      POSTGRES_DB: motordesk
    volumes: [ postgres_data:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
    networks: [ backend ]

  redis:
    image: redis:8-alpine
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: motordesk_pass
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - motordesk_pass
      - --user
      - motordesk
      - "on"
      - ">motordesk_pass"
      - "~*"
      - "+@all"
    volumes:
      - redis_data:/data

    healthcheck:
      test: [ "CMD-SHELL","redis-cli", "-u", "redis://$$REDIS_PASSWORD@$$REDIS_HOST:6379", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend

  mongo:
    image: mongo:8.0.34
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?Set MONGO_USER for the local MongoDB container}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD for the local MongoDB container}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ backend ]

volumes:
  postgres_data:
  redis_data:
  mongo_data:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
