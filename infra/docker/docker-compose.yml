version: '3.8'

services:
  app:
    build: { context: ../.., dockerfile: Dockerfile }
    ports: [ "8080:8080" ]
    depends_on:
      sql-database: { condition: service_healthy }
      dynamodb: { condition: service_started }
      redis: { condition: service_healthy }

    networks: [ backend,frontend ]

  sql-database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: motordesk
      POSTGRES_PASSWORD: motordesk_pass
      POSTGRES_DB: motordesk
    volumes: [ postgres_data:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
    networks: [ backend ]

  dynamodb:
    image: amazon/dynamodb-local:latest
    command: [ "-sharedDb", "-dbPath", "./data" ]
    working_dir: /home/dynamodblocal
    volumes: [ dynamodb_data:/home/dynamodblocal/data ]
    networks: [ backend ]

  redis:
    image: redis:8-alpine
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: motordesk_pass
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - motordesk_pass
      - --user
      - motordesk
      - "on"
      - ">motordesk_pass"
      - "~*"
      - "+@all"
    volumes:
      - redis_data:/data

    healthcheck:
      test: [ "CMD-SHELL","redis-cli", "-u", "redis://$$REDIS_PASSWORD@$$REDIS_HOST:6379", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend

volumes:
  postgres_data:
  dynamodb_data:
  redis_data:

networks:
  backend:
    driver: bridge
    internal: true
  frontend:
    driver: bridge
