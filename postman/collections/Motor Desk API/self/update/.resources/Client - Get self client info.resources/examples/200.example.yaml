$kind: http-example
request:
  url: "{{baseUrl}}/self/update"
  method: PUT
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": 8768,
          "addressId": 6834,
          "firstName": "string",
          "lastName": "string",
          "email": "string",
          "phone": "string",
          "cpf": "string",
          "isActive": false,
          "createdAt": "string",
          "updatedAt": "string",
          "companyId": 3689
        },
        "status": 9652,
        "errors": null
      }
order: 1000
