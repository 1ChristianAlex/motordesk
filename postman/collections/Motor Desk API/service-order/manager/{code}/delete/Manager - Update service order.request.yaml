$kind: http-request
description: Update service order
url: "{{baseUrl}}/service-order/manager/:code/delete"
method: DELETE
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  code: string
body:
  type: json
  content: |-
    {
      "code": "string",
      "operatorRole": "ENGINEER",
      "complaint": null,
      "diagnosis": "string",
      "tasksIds": [
        2929,
        9661
      ],
      "inventoryItemsIds": [
        8456,
        9887
      ],
      "status": "DELIVERED"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
examples: ./.resources/Manager - Update service order.resources/examples
order: 1000
