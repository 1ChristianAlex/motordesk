$kind: http-example
request:
  url: "{{baseUrl}}/service-order/manager/:code/delete"
  method: DELETE
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    code: string
  body:
    type: json
    content: |-
      {
        "code": "string",
        "operatorRole": "ENGINEER",
        "complaint": null,
        "diagnosis": "string",
        "tasksIds": [
          2929,
          9661
        ],
        "inventoryItemsIds": [
          8456,
          9887
        ],
        "status": "DELIVERED"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {},
        "status": 9036,
        "errors": null
      }
order: 2000
