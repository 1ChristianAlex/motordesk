$kind: http-request
description: Client can only retrieve its own service order given a service order's code
url: "{{baseUrl}}/service-order/client/:code"
method: GET
headers:
  Accept: application/json
pathVariables:
  code: string
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
examples: ./.resources/Client - Get service order.resources/examples
order: 1000
