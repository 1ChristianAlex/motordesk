$kind: http-example
request:
  url: "{{baseUrl}}/vehicles/create"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "plate": "string",
        "brand": "string",
        "model": "string",
        "color": "string",
        "year": 8062,
        "chassis": "string",
        "fuelType": "GASOLINE",
        "ownerId": 9236,
        "id": 2579,
        "mileage": 8700
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {},
        "status": 9036,
        "errors": null
      }
order: 2000
