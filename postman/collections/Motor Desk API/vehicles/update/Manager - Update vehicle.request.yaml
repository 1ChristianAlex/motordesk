$kind: http-request
name: Manager - Update vehicle
url: "{{baseUrl}}/vehicles/update"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "id": 1,
      "color": "RED",
      "mileage": 56663
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
examples: ./.resources/Manager - Update vehicle.resources/examples
order: 1000
