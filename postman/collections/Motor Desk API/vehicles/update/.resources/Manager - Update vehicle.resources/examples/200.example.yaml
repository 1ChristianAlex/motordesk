$kind: http-example
request:
  url: "{{baseUrl}}/vehicles/update"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "id": 5880,
        "color": "string",
        "mileage": 5599
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {},
        "status": 9036,
        "errors": null
      }
order: 1000
