$kind: http-request
description: You can login using email, cpf or cnpj
url: "{{baseUrl}}/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "userName": "string",
      "password": "string"
    }
examples: ./.resources/Login.resources/examples
order: 1000
